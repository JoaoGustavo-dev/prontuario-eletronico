spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  security:
    profissional:
      usuario: ${AUTH_PROFISSIONAL_USUARIO}
      senha: ${AUTH_PROFISSIONAL_SENHA}
    leitor:
      usuario: ${AUTH_LEITOR_USUARIO}
      senha: ${AUTH_LEITOR_SENHA}